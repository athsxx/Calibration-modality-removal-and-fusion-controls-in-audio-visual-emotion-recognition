paths:
  dataset_root: ".."
  artifacts_root: "artifacts"

data:
  task: "emotion4"
  include_invalid: false
  emotion4_labels: ["angry", "happy_excited", "neutral", "sad"]
  distress_proxy:
    valence_lt: 3.0
    activation_gt: 3.0

features:
  audio_backend: "logmel"
  audio_sample_rate: 16000
  n_mels: 80
  video_backend: "resnet18"
  video_dir: "video"
  video_pipeline: v1_legacy
  video_fps: 4.0
  video_max_frames: 32
  audio_max_tokens: 400
  face_margin: 0.25

model:
  hidden_dim: 256
  num_heads: 4
  fusion_layers: 2
  dropout: 0.2
  num_classes: 4

training:
  seed: 42
  batch_size: 16
  epochs: 40
  patience: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 0
  device: "mps"
  video_device: "cpu"
  max_nonfinite_batches: 1
  loss_weights:
    emotion: 1.0
    va: 0.2
    alignment: 0.05
    orthogonality: 0.05
    audio_to_video_distillation: 0.05
    video_to_audio_distillation: 0.05
