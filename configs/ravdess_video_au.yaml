paths:
  dataset_root: ".."
  artifacts_root: "artifacts_ravdess"
  manifest_file: "manifests/utterances.csv"
  splits_file: "splits/emotion4_session_folds.json"

data:
  task: "emotion4"
  has_va: false
  dataset_name: "ravdess"
  include_invalid: false
  emotion4_labels: ["angry", "happy_excited", "neutral", "sad"]
  distress_proxy:
    valence_lt: 3.0
    activation_gt: 3.0

features:
  audio_backend: "logmel"
  audio_sample_rate: 16000
  n_mels: 80
  video_backend: "openface_au"
  video_dir: "video_au"
  video_pipeline: v2
  video_fps: 6.0
  video_max_frames: 32
  face_margin: 0.35
  audio_max_tokens: 400
  face_region: "full_frame"
  au_batch_size: 32

model:
  hidden_dim: 256
  num_heads: 4
  fusion_layers: 2
  dropout: 0.2
  num_classes: 4

training:
  seed: 42
  batch_size: 16
  epochs: 40
  patience: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 0
  device: "mps"
  video_device: "cpu"
  loss_weights:
    emotion: 1.0
    va: 0.0
    alignment: 0.05
    orthogonality: 0.05
    audio_to_video_distillation: 0.05
    video_to_audio_distillation: 0.05
