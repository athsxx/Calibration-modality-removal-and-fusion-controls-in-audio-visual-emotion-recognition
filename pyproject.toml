[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iemocap-mer"
version = "1.0.0"
description = "Calibration, modality removal, and fusion controls in audio-visual emotion recognition (IEMOCAP, RAVDESS, CREMA-D)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "opencv-python>=4.9",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "torch>=2.3",
  "torchaudio>=2.3",
  "torchvision>=0.18",
  "tqdm>=4.66",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "seaborn>=0.12"]
au = ["py-feat==2.1.1"]
test = ["pytest>=8.0"]

[project.scripts]
iemocap-mer = "iemocap_mer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "mer_companion"]
testpaths = ["tests", "mer_companion/tests"]
